name: Build

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Pack the targets and obfuscate a sample with them, on every OS the package supports.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        runner: [dotnet]
        include:
          - os: windows-latest
            runner: exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack and obfuscate the sample (${{ matrix.runner }} runner)
        run: ./test.sh -p:ObfuscarRunner=${{ matrix.runner }}

  # A push to main publishes the version in the project file to nuget.org, tags it v<version> and
  # creates a GitHub release. A version that is already on nuget.org is skipped, so bump <Version>
  # in Humbatt.MSBuild.Obfuscar.csproj to release.
  # Signs in to nuget.org with Trusted Publishing (OIDC), so no API key is stored.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: nuget
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # GitHub release and tag
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack
        id: pack
        run: |
          dotnet pack MSBuild.Obfuscar/Humbatt.MSBuild.Obfuscar.csproj -c Release
          version=$(dotnet msbuild MSBuild.Obfuscar/Humbatt.MSBuild.Obfuscar.csproj -getProperty:Version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.pack.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released."
          else
            gh release create "$TAG" artifacts/*.nupkg --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
