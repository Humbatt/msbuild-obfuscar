# Pull request validation: packs the targets and obfuscates a sample with them on every OS the
# package supports. Publishes nothing.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        runner: [dotnet]
        include:
          - os: windows-latest
            runner: exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Pack and obfuscate the sample (${{ matrix.runner }} runner)
        run: ./test.sh -p:ObfuscarRunner=${{ matrix.runner }}
